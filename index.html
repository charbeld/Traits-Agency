<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traits Agency</title>
    <meta
      name="description"
      content="Traits Agency curates thoughtful talent for fashion, film, and digital campaigns with a minimalist approach."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&family=Prata&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="top-nav">
        <a class="brand" href="index.html">
          <img src="traits-logo.png" alt="Traits Agency" class="brand-logo" />
        </a>
      </header>

      <main>
        <nav class="hero-nav" aria-label="Primary">
          <a href="about.html">About Us</a>
          <a href="contact.html">Contact Us</a>
        </nav>

        <section class="hero" aria-labelledby="hero-title">
          <video class="hero-video" autoplay muted loop playsinline preload="auto">
            <source src="logo animation.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
          <div class="hero-overlay" aria-hidden="true"></div>
          <div class="hero-inner">
            <h1 id="hero-title">Connecting talent with opportunity</h1>
          </div>
        </section>

        <section class="hero-actions">
          <div class="cta-panel">
            <a class="btn btn-primary" href="apply.html">Apply Now</a>
          </div>
        </section>
      </main>

      <footer class="page-footer">
        <div class="footer-contact">
          <div class="footer-contact-row">
            <svg class="footer-contact-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path
                d="M3.5 12h17M12 3.5c2.8 3.1 2.8 13.9 0 17M12 3.5c-2.8 3.1-2.8 13.9 0 17"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
            </svg>
            <span>Dubai - UAE</span>
          </div>
          <div class="footer-contact-row">
            <svg class="footer-contact-icon footer-contact-icon--phone" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7.1 4.2c.8-.6 2.4-.2 3.6.9l1.6 1.5c.7.7.7 1.8 0 2.5l-.9.9c-.3.3-.3.8-.1 1.2 1.2 2.2 3.2 4.1 5.4 5.3.4.2.9.1 1.2-.2l.9-.9c.7-.7 1.8-.7 2.5 0l1.6 1.6c1.1 1.1 1.5 2.7.9 3.5-1.2 1.6-3.9 1.8-6.9.6-2.8-1.1-6-3.3-8.3-5.6-2.3-2.3-4.5-5.5-5.6-8.3-1.2-3-.9-5.7.6-6.9z"
                fill="currentColor"
              />
            </svg>
            <span>+971 50 947 2795</span>
          </div>
          <div class="footer-contact-row">
            <svg class="footer-contact-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect
                x="3"
                y="6"
                width="18"
                height="12"
                rx="2"
                ry="2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M3 7l9 7 9-7"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span><a href="mailto:marc@traits-agency.com">marc@traits-agency.com</a></span>
          </div>
          <div class="footer-contact-row">
            <svg class="footer-contact-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="5"
                ry="5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
            </svg>
            <span>
              <a
                href="https://www.instagram.com/traits.agency?igsh=MTFsdjYxdGhnM3lteA=="
                target="_blank"
                rel="noopener"
              >
                @traits.agency
              </a>
            </span>
          </div>
        </div>
        <small>&copy; <span data-current-year>2025</span> Traits Agency. All rights reserved.</small>
      </footer>
    </div>
    <script>
      document.querySelectorAll('[data-current-year]').forEach((yearEl) => {
        yearEl.textContent = new Date().getFullYear();
      });
      const heroVideo = document.querySelector('.hero-video');
      if (heroVideo) {
        const playAttempt = heroVideo.play();
        if (playAttempt && typeof playAttempt.catch === 'function') {
          playAttempt.catch(() => {});
        }
      }
    </script>
  </body>
</html>
